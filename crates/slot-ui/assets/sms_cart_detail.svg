<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135">
  <defs>
    <!-- The ridges under the label strip, and the seam above the connector. -->
    <g id="grip">
      <rect x="3" y="44" width="234" height="1.8" rx="0.6"/>
      <rect x="3" y="48" width="234" height="1.8" rx="0.6"/>
      <rect x="3" y="52" width="234" height="1.8" rx="0.6"/>
      <rect x="3" y="56" width="234" height="1.8" rx="0.6"/>
      <rect x="0" y="130" width="240" height="1.2"/>
    </g>
  </defs>
  <g fill="#fff">
    <use href="#grip" x="1.1" y="1.1"/>
  </g>
  <g fill="#000">
    <use href="#grip"/>
  </g>
</svg>
