         embossed SEGA plate below it. -->
    <g id="grip">
      <rect x="62" y="28" width="116" height="2.2" rx="0.6"/>
      <rect x="62" y="35" width="116" height="2.2" rx="0.6"/>
    </g>
    <g id="lines">
      <path d="M 6 19 L 234 19"/>
      <path d="M 12 104 L 12 50 Q 12 42 20 42 L 220 42 Q 228 42 228 50 L 228 104"/>
      <rect x="75" y="203" width="90" height="24" rx="12"/>
    </g>
    <g id="sega">
      <path d="M 99 209 L 87 209 Q 84 209 84 212 Q 84 215 87 215 L 96 215 Q 99 215 99 218 Q 99 221 96 221 L 84 221"/>
      <path d="M 118 209 L 104 209 L 104 221 L 118 221 M 104 215 L 115 215"/>
      <path d="M 137 209 L 125 209 Q 122 209 122 212 L 122 218 Q 122 221 125 221 L 134 221 Q 137 221 137 218 L 137 215 L 130 215"/>
      <path d="M 141 221 L 141 213 Q 141 209 145 209 L 152 209 Q 156 209 156 213 L 156 221 M 141 215.5 L 156 215.5"/>
    </g>
  </defs>
  <g fill="#fff">
