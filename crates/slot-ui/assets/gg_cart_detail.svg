  </g>
  <g fill="none" stroke="#000" stroke-width="1.3">
    <use href="#lines"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="2.4">
    <use href="#sega" x="0.6" y="0.6"/>
  </g>
</svg>
