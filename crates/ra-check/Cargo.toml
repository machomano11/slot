[package]
name = "ra-check"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Checks a folder of games against RetroAchievements, from a computer"

[dependencies]
slot-cheevos = { path = "../slot-cheevos" }
slot-net = { path = "../slot-net" }
serde_json = "1"
unicode-normalization = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
